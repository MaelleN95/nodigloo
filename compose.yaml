services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:8080}
    ports:
      - '${SERVER_PORT:-3001}:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - '${CLIENT_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy
