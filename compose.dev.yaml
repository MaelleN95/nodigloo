services:
  client:
    build: !reset null
    image: node:20-alpine
    working_dir: /app
    environment:
      VITE_SERVER_URL: ${VITE_SERVER_URL:-http://localhost:3001}
      VITE_USE_POLLING: 'true'
    command:
      - sh
      - -c
      - npm install --workspace @nodigloo/client --include-workspace-root && npm run build --workspace @nodigloo/shared && npm run dev --workspace @nodigloo/client -- --host 0.0.0.0 --port 80
    volumes:
      - .:/app
      - client_node_modules:/app/node_modules
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:80/
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

volumes:
  client_node_modules:
